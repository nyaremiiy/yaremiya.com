# Альтернатива Caddy: налаштування nginx для yaremiya.com.
# Сертифікат отримується командою:  sudo certbot --nginx -d yaremiya.com -d www.yaremiya.com
# Файл кладемо в /etc/nginx/sites-available/yaremiya і вмикаємо посиланням у sites-enabled.

server {
    listen 80;
    listen [::]:80;
    server_name yaremiya.com www.yaremiya.com;
    return 301 https://yaremiya.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.yaremiya.com;
    ssl_certificate     /etc/letsencrypt/live/yaremiya.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yaremiya.com/privkey.pem;
    return 301 https://yaremiya.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name yaremiya.com;

    ssl_certificate     /etc/letsencrypt/live/yaremiya.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yaremiya.com/privkey.pem;

    root /var/www/yaremiya/current;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    server_tokens off;

    # Файли з відбитком у назві — кешуємо на рік
    # Фото рослин: назви файлів випадкові й не змінюються — кешуємо надовго.
    location /media/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~* \.(svg|ico|woff2)$ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "public, max-age=0, must-revalidate";
        try_files $uri $uri/ $uri.html =404;
    }

    # Пізніше — сервіс заявок (відправка в Telegram):
    # location /api/ {
    #     proxy_pass http://127.0.0.1:8787;
    # }

    error_page 404 /404.html;
}
